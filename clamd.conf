# ClamAV 데몬(clamd) 설정 — 업로드 파일 악성코드 검사용 (2026-07-25)
#
# Debian clamav-daemon 패키지가 기본으로 까는 /etc/clamav/clamd.conf 대신 이 파일을
# 직접 지정해서 쓴다(docker-entrypoint.sh의 `clamd --config-file=/app/clamd.conf`) —
# 기본값의 StreamMaxLength(보통 25M)가 이 앱의 PDF 업로드 상한(500MB, main.py의
# MAX_UPLOAD_SIZE)보다 훨씬 작아서, 그대로 두면 정상적인 대용량 문서까지 "크기 초과"로
# 검사 자체가 거부돼버린다.

LocalSocket /var/run/clamav/clamd.ctl
FixStaleSocket true
LocalSocketGroup clamav
LocalSocketMode 666
User clamav

PidFile /var/run/clamav/clamd.pid
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp

LogFile /var/log/clamav/clamd.log
LogFileMaxSize 5M
LogTime true
LogSyslog false

# main.py의 업로드 상한(PDF 500MB, 비-PDF 100MB)보다 여유 있게 잡아둔다.
StreamMaxLength 550M
MaxFileSize 550M
MaxScanSize 550M

MaxThreads 4
ReadTimeout 300
