# Knowledge Hub 운영 구성 — VM 한 대에서 docker compose로 띄운다 (2026-10-25)
#
#   cp deploy/.env.example deploy/.env   # 값 채우기
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# 밖으로 열리는 포트는 caddy의 80/443뿐이다. app·opensearch·postgres는 이 compose 네트워크 안에서만 통신한다.
# 라이선스: OpenSearch Apache-2.0, PostgreSQL License, Caddy Apache-2.0 (모두 허용형).

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # 발급받은 인증서
      - caddy_config:/config
    depends_on:
      - app

  app:
    build:
      context: ..
      args:
        EMBED_MODEL: ${EMBED_MODEL:-nlpai-lab/KURE-v1}
        EMBED_DIM: ${EMBED_DIM:-1024}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://knowledge_hub:${POSTGRES_PASSWORD}@postgres:5432/knowledge_hub
      OPENSEARCH_URL: http://opensearch:9200
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
    volumes:
      - app_data:/data            # 업로드 원본·파싱 JSON·백업
    depends_on:
      - postgres
      - opensearch

  opensearch:
    build: ../backend/opensearch   # OpenSearch 3.9.0 + nori, 보안 플러그인 꺼짐 → 포트를 밖으로 열지 않는다
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  postgres:
    # 앱 이미지의 pg_dump가 17이라(자동 백업이 사용) 서버도 17로 맞춘다 — 서버가 더 높으면 pg_dump가 거부한다
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledge_hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: knowledge_hub
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  app_data:
  opensearch_data:
  postgres_data:
